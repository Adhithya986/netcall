# Render Infrastructure as Code Blueprint for NetCall
services:
  # Backend API & Socket.IO Signaling Server
  - type: web
    name: netcall-api
    env: node
    plan: free
    buildCommand: npm ci && npm run build --workspace=@netcall/shared && npm run build --workspace=@netcall/api
    startCommand: node apps/api/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: USE_IN_MEMORY_DB
        value: "true"
      - key: TELEPHONY_PROVIDER
        value: MOCK
      - key: TELEPHONY_SANDBOX_MODE
        value: "true"

  # Frontend Web Client
  - type: static
    name: netcall-web
    buildCommand: npm ci && npm run build --workspace=@netcall/shared && npm run build --workspace=@netcall/web
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: netcall-api
          property: host
      - key: VITE_SOCKET_URL
        fromService:
          type: web
          name: netcall-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
