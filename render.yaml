# Render Infrastructure as Code Blueprint for NetCall
services:
  # NetCall Full-Stack Service (Node.js API + WebSockets Signaling + React Client)
  - type: web
    name: netcall
    env: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node apps/api/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: USE_IN_MEMORY_DB
        value: "true"
      - key: TELEPHONY_PROVIDER
        value: MOCK
      - key: TELEPHONY_SANDBOX_MODE
        value: "true"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: INITIAL_USER_WALLET_PAISE
        value: "50000"
      - key: PSTN_CALL_RATE_PAISE_PER_MIN
        value: "150"
