# Coturn STUN/TURN server configuration for NetCall
listening-port=3478
tls-listening-port=5349

realm=netcall.local
server-name=netcall-turn

fingerprint
lt-cred-mech
use-auth-secret
static-auth-secret=netcall_coturn_auth_secret_change_in_production

min-port=49152
max-port=65535

no-cli
no-loopback-peers
no-multicast-peers
verbose
